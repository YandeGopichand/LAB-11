<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            color: {{ color }};
        }

        p {
            color: #475569;
            font-size: 17px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        a:hover {
            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>{{ title }}</h1>

        <p>{{ message }}</p>

        <a href="{{ link }}">
            {{ link_text }}
        </a>

    </div>

</body>

</html>
